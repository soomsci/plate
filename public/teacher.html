<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a2b" />
    <title>교사 대시보드 — 경계선</title>
    <link rel="stylesheet" href="./vendor/leaflet.css?v=1.9.4" />
    <link rel="stylesheet" href="./styles.css?v=20260903-10" />
  </head>
  <body class="teacher-page">
    <header class="teacher-header">
      <a class="brand compact" href="./index.html"><span class="brand-mark">⌁</span><span>경계선</span></a>
      <div class="teacher-title"><span>TEACHER DASHBOARD</span><h1>판의 경계 탐구</h1></div>
      <div class="mode-badge"><span id="cloud-dot"></span><b id="backend-mode">연결 확인 중</b></div>
    </header>

    <main class="teacher-shell">
      <aside class="teacher-sidebar">
        <section class="session-card">
          <p class="panel-label">CLASS CODE</p>
          <div id="session-empty">
            <h2>반별 고정 수업 코드</h2>
            <p>반 이름과 코드를 한 번 정하면 다음 수업에도 같은 코드로 입장할 수 있습니다.</p>
            <form id="class-session-form" class="class-session-form">
              <label for="class-name">반 이름<input id="class-name" maxlength="20" autocomplete="off" placeholder="예: 2학년 1반" required /></label>
              <label for="fixed-code">고정 코드<input id="fixed-code" maxlength="6" minlength="4" pattern="[A-Za-z0-9]{4,6}" autocomplete="off" placeholder="예: CLASS1" required /></label>
              <button id="create-session" class="button button-accent full" type="submit">이 코드로 수업 열기</button>
            </form>
            <div id="saved-classes" class="saved-classes is-hidden"></div>
          </div>
          <div id="session-active" class="is-hidden">
            <div class="active-class-heading"><b id="active-class-name">반 이름 없음</b><button id="switch-class" type="button">다른 반 선택</button></div>
            <button id="copy-code" class="class-code" type="button"><b id="class-code">------</b><span>눌러서 복사</span></button>
            <div class="join-url"><span id="join-url">주소 준비 중</span><button id="copy-url" type="button">복사</button></div>
            <button id="restart-session" class="restart-session" type="button">같은 코드로 새 수업 시작</button>
          </div>
        </section>

        <section class="progress-card">
          <div class="section-heading">
            <div><p class="panel-label">LIVE STATUS</p><h2>모둠 제출 현황</h2></div>
            <div class="group-summary"><b id="submitted-total">0/7</b><button id="reset-submissions" type="button" disabled>전체 초기화</button></div>
          </div>
          <div id="group-status-list" class="group-status-list"></div>
        </section>

        <section class="control-card">
          <p class="panel-label">LESSON CONTROL</p>
          <div class="control-stack">
            <button id="enable-data-exploration" class="control-button" type="button"><span>1</span><div><b>데이터 탐구 시작 허용</b><small>학생의 데이터 탐구 버튼을 활성화합니다.</small></div></button>
            <button id="release-volcanoes" class="control-button secondary" type="button"><span>2A</span><div><b>화산 자료 배포</b><small>학생 지도에 화산 좌표를 바로 표시합니다.</small></div></button>
            <button id="release-earthquakes" class="control-button secondary" type="button"><span>2B</span><div><b>지진 자료 배포</b><small>학생 지도에 지진 좌표를 바로 표시합니다.</small></div></button>
            <button data-phase="compare" class="control-button" type="button"><span>3</span><div><b>제출 마감·모둠 비교</b><small>학생 편집을 멈추고 선을 겹칩니다.</small></div></button>
            <button data-phase="reveal" class="control-button" type="button"><span>4</span><div><b>실제 경계 공개</b><small>전 세계 결과와 정답을 비교합니다.</small></div></button>
            <button data-phase="eastAsia" data-boundary="false" class="control-button" type="button"><span>5</span><div><b>일본·한반도 적용</b><small>확대하고 경계는 다시 숨깁니다.</small></div></button>
            <button id="east-boundary" class="control-button secondary" type="button"><span>6</span><div><b>동아시아 경계 확인</b><small>일본과 한반도의 거리를 비교합니다.</small></div></button>
            <button id="korea-detail" class="control-button secondary" type="button"><span>7</span><div><b>한반도 상세 자료</b><small>작은 지진을 추가로 표시합니다.</small></div></button>
            <button id="close-session" class="control-button danger" type="button"><span>8</span><div><b>수업 세션 종료</b><small>학생 편집과 제출을 모두 마감합니다.</small></div></button>
          </div>
        </section>
      </aside>

      <section class="dashboard-map-area">
        <div id="teacher-map" class="map-canvas"></div>
        <div class="dashboard-topbar">
          <div><span class="live-dot"></span><b id="phase-label">수업 준비</b></div>
          <div class="map-actions">
            <button id="toggle-timeline" class="button button-ghost" type="button" aria-pressed="true">재생바 숨기기</button>
            <button id="world-view" class="button button-ghost" type="button">세계 지도</button>
            <button id="presentation-mode" class="button button-ghost" type="button">전체 화면</button>
          </div>
        </div>
        <div class="quake-timeline teacher-timeline" data-earthquake-timeline>
          <div class="timeline-heading">
            <span><b data-timeline-date>전체 기간</b><small data-timeline-count>자료 불러오는 중</small></span>
            <button data-timeline-reset type="button">처음</button>
          </div>
          <div class="timeline-controls">
            <button class="timeline-play" data-timeline-play type="button" aria-label="지진 누적 재생">▶ 재생</button>
            <input data-timeline-range type="range" aria-label="지진 발생 누적 시점" />
          </div>
          <div class="timeline-years"><span data-timeline-start>2000</span><span>시간에 따라 지진 누적</span><span data-timeline-end>현재</span></div>
        </div>
        <div class="overlay-legend">
          <button id="teacher-toggle-earthquakes" class="legend-toggle is-active" type="button" aria-pressed="true"><span class="legend-dot quake"></span><b>지진 켜짐</b></button>
          <button id="teacher-toggle-volcanoes" class="legend-toggle is-active" type="button" aria-pressed="true"><span class="legend-triangle"></span><b>화산 켜짐</b></button>
          <div class="submission-chapter-filter" role="group" aria-label="모둠 선 구분">
            <button data-submission-chapter="all" class="is-active" type="button" aria-pressed="true">전체 선</button>
            <button data-submission-chapter="volcano" type="button" aria-pressed="false">화산 선</button>
            <button data-submission-chapter="earthquake" type="button" aria-pressed="false">지진 선</button>
          </div>
          <span class="legend-line student-line dashed"></span> 화산 선
          <span class="legend-line student-line"></span> 지진 선
          <span class="legend-line answer-line"></span> 실제 경계
        </div>
        <div id="evidence-drawer" class="evidence-drawer">
          <button id="drawer-toggle" type="button"><span>모둠 근거 보기</span><b>⌃</b></button>
          <div id="evidence-list" class="evidence-list"></div>
        </div>
      </section>
    </main>

    <div id="teacher-toast" class="toast" role="status"></div>
    <script src="./vendor/leaflet.js?v=1.9.4"></script>
    <script type="module" src="./teacher.js?v=20260903-11"></script>
  </body>
</html>
